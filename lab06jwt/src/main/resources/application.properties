spring.application.name=lab06-jwt
server.port=8080

# SQL Server DataSource
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=OrchidJWTLab;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration (Secret key 256-bit Base64 encoded)
security.jwt.secret-key=${JWT_SECRET}
# 1 hour expiration in ms
security.jwt.expiration-time=3600000
