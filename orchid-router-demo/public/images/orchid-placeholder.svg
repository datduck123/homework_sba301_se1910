<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Warm soft peach / skin tone background -->
    <linearGradient id="skinBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="50%" stop-color="#faeee3"/>
      <stop offset="100%" stop-color="#f4dfd0"/>
    </linearGradient>

    <!-- Orchid Purple / Magenta Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="softPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8c5836" flood-opacity="0.16"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8c5836" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Nền Canvas màu da người nhạt -->
  <rect width="800" height="450" fill="url(#skinBgGrad)"/>

  <!-- Vầng sáng trang trí ấm áp -->
  <circle cx="120" cy="80" r="160" fill="#fbdcc4" opacity="0.45"/>
  <circle cx="700" cy="370" r="190" fill="#fce4d4" opacity="0.6"/>
  <circle cx="400" cy="180" r="170" fill="#ffffff" opacity="0.4"/>

  <!-- ================= TRUNG TÂM: ĐỒ HỌA HOA LAN ================= -->
  <g transform="translate(400, 160)" filter="url(#softShadow)">
    <rect x="-110" y="-95" width="220" height="190" rx="24" fill="#ffffff" stroke="#e8d5c4" stroke-width="2"/>

    <!-- Cành và Lá lan -->
    <path d="M 0,90 Q 20,40 10,-10" stroke="url(#leafGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 10,40 Q 50,30 65,55 Q 35,65 10,40" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M 5,60 Q -40,50 -55,75 Q -25,85 5,60" fill="url(#leafGrad)" opacity="0.85"/>

    <!-- Cánh hoa -->
    <path d="M 0,-15 C -25,-65 25,-65 0,-15 Z" fill="url(#softPetalGrad)"/>
    <path d="M -5,-5 C -45,35 -5,45 -5,-5 Z" fill="url(#petalGrad)" opacity="0.9"/>
    <path d="M 5,-5 C 45,35 5,45 5,-5 Z" fill="url(#petalGrad)" opacity="0.9"/>
    <path d="M -10,-15 C -65,-40 -55,5 -10,-5 Z" fill="url(#petalGrad)"/>
    <path d="M 10,-15 C 65,-40 55,5 10,-5 Z" fill="url(#petalGrad)"/>

    <!-- Nhụy hoa -->
    <path d="M 0,-10 C -22,-2 -18,22 0,26 C 18,22 22,-2 0,-10 Z" fill="url(#centerGrad)"/>
    <ellipse cx="0" cy="-2" rx="6" ry="7" fill="#ffffff"/>
    <circle cx="-3" cy="8" r="1.5" fill="#701a75"/>
    <circle cx="3" cy="8" r="1.5" fill="#701a75"/>
    <circle cx="0" cy="13" r="1.5" fill="#701a75"/>
  </g>

  <!-- ================= CÁC HUY HIỆU ROUTE / ĐẶC TRƯNG ================= -->
  <g transform="translate(160, 145)" filter="url(#badgeShadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#ffffff" stroke="#c026d3" stroke-width="1.8"/>
    <path d="M -46,6 C -52,-2 -42,-10 -36,-10 C -30,-10 -20,-2 -26,6 Z" fill="#c026d3"/>
    <rect x="-12" y="-7" width="55" height="5" rx="2.5" fill="#334155"/>
    <rect x="-12" y="3" width="36" height="5" rx="2.5" fill="#c026d3"/>
  </g>

  <g transform="translate(640, 145)" filter="url(#badgeShadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
    <polygon points="-38,-10 -35,-2 -27,-2 -33,3 -31,11 -38,6 -45,11 -43,3 -49,-2 -41,-2" fill="#f59e0b"/>
    <rect x="-12" y="-7" width="55" height="5" rx="2.5" fill="#334155"/>
    <rect x="-12" y="3" width="36" height="5" rx="2.5" fill="#f59e0b"/>
  </g>

  <g transform="translate(230, 255)" filter="url(#badgeShadow)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
    <path d="M -44,5 Q -32,-8 -32,-8 Q -32,5 -44,5 Z" fill="#059669"/>
    <line x1="-44" y1="5" x2="-32" y2="-8" stroke="#ffffff" stroke-width="1"/>
    <rect x="-16" y="-5" width="48" height="4" rx="2" fill="#059669"/>
    <rect x="-16" y="3" width="32" height="4" rx="2" fill="#64748b"/>
  </g>

  <g transform="translate(570, 255)" filter="url(#badgeShadow)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#ffffff" stroke="#ec4899" stroke-width="1.6"/>
    <circle cx="-42" cy="-4" r="3.5" fill="#c026d3"/>
    <circle cx="-34" cy="-4" r="3.5" fill="#fbbf24"/>
    <circle cx="-38" cy="4" r="3.5" fill="#ec4899"/>
    <rect x="-16" y="-5" width="48" height="4" rx="2" fill="#ec4899"/>
    <rect x="-16" y="3" width="32" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- ================= BANNER ĐIỂM NHẤN ================= -->
  <g transform="translate(400, 325)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#centerGrad)"/>
    <circle cx="-50" cy="0" r="3" fill="#c026d3"/>
    <circle cx="-25" cy="0" r="2" fill="#94a3b8"/>
    <circle cx="25" cy="0" r="2" fill="#94a3b8"/>
    <circle cx="50" cy="0" r="3" fill="#059669"/>
  </g>

  <g transform="translate(400, 365)" filter="url(#badgeShadow)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#ffffff" stroke="#ebd9cc" stroke-width="1.5"/>
    <circle cx="-135" cy="0" r="7" fill="#c026d3"/>
    <rect x="-115" y="-7" width="105" height="14" rx="4" fill="#faeee3"/>
    <rect x="-110" y="-4" width="95" height="8" rx="2" fill="#c026d3"/>
    <rect x="5" y="-7" width="60" height="14" rx="4" fill="#f59e0b"/>
    <circle cx="105" cy="-2" r="5" fill="#059669"/>
    <path d="M 105,3 L 105,9" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <circle cx="135" cy="0" r="7" fill="#ec4899"/>
  </g>

  <rect x="330" y="410" width="140" height="5" rx="2.5" fill="url(#petalGrad)"/>
</svg>
