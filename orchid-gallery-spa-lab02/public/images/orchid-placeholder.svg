<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <!-- Warm soft peach / light skin tone background -->
    <linearGradient id="skinBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="50%" stop-color="#faeee3"/>
      <stop offset="100%" stop-color="#f4dfd0"/>
    </linearGradient>

    <!-- Orchid Purple Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Soft Petal Secondary Gradient -->
    <linearGradient id="softPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Lip & Center Golden/Coral Gradient -->
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8c5836" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Soft peach canvas background -->
  <rect width="640" height="420" fill="url(#skinBgGrad)"/>

  <!-- Decorative glowing circles -->
  <circle cx="100" cy="70" r="130" fill="#fbdcc4" opacity="0.45"/>
  <circle cx="560" cy="350" r="150" fill="#fce4d4" opacity="0.6"/>
  <circle cx="320" cy="170" r="140" fill="#ffffff" opacity="0.4"/>

  <!-- Center orchid flower -->
  <g transform="translate(320, 160)" filter="url(#softShadow)">
    <rect x="-95" y="-85" width="190" height="170" rx="20" fill="#ffffff" stroke="#e8d5c4" stroke-width="2"/>

    <!-- Orchid stem and leaves -->
    <path d="M 0,80 Q 18,35 9,-10" stroke="url(#leafGrad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 9,35 Q 45,25 55,48 Q 30,56 9,35" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M 4,52 Q -35,44 -48,65 Q -22,74 4,52" fill="url(#leafGrad)" opacity="0.85"/>

    <!-- Petals -->
    <path d="M 0,-15 C -22,-58 22,-58 0,-15 Z" fill="url(#softPetalGrad)"/>
    <path d="M -4,-5 C -40,30 -4,40 -4,-5 Z" fill="url(#petalGrad)" opacity="0.9"/>
    <path d="M 4,-5 C 40,30 4,40 4,-5 Z" fill="url(#petalGrad)" opacity="0.9"/>
    <path d="M -9,-15 C -58,-36 -48,5 -9,-5 Z" fill="url(#petalGrad)"/>
    <path d="M 9,-15 C 58,-36 48,5 9,-5 Z" fill="url(#petalGrad)"/>

    <!-- Orchid lip and column -->
    <path d="M 0,-10 C -20,-2 -16,20 0,23 C 16,20 20,-2 0,-10 Z" fill="url(#centerGrad)"/>
    <ellipse cx="0" cy="-2" rx="5" ry="6" fill="#ffffff"/>
    <circle cx="-2.5" cy="7" r="1.2" fill="#701a75"/>
    <circle cx="2.5" cy="7" r="1.2" fill="#701a75"/>
    <circle cx="0" cy="11.5" r="1.2" fill="#701a75"/>
  </g>

  <!-- Orchid Gallery typography -->
  <text x="320" y="325" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="bold" fill="#86198f" letter-spacing="1">ORCHID GALLERY</text>
  <text x="320" y="352" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#a21caf" letter-spacing="3">NATURAL EXQUISITE COLLECTION</text>
</svg>
