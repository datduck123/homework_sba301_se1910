<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Nền màu da người nhạt ấm áp -->
    <linearGradient id="skinBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="50%" stop-color="#faeee3"/>
      <stop offset="100%" stop-color="#f4dfd0"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8c5836" flood-opacity="0.16"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8c5836" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Nền Canvas màu da người nhạt -->
  <rect width="800" height="450" fill="url(#skinBgGrad)"/>

  <!-- Vầng sáng trang trí ấm áp -->
  <circle cx="120" cy="80" r="160" fill="#fbdcc4" opacity="0.45"/>
  <circle cx="700" cy="370" r="190" fill="#fce4d4" opacity="0.6"/>
  <circle cx="400" cy="170" r="180" fill="#ffffff" opacity="0.4"/>

  <!-- ================= TRUNG TÂM: MINISTORE SPA ROUTER DASHBOARD ================= -->
  <g transform="translate(400, 155)" filter="url(#softShadow)">
    <!-- Thẻ nền trắng console -->
    <rect x="-115" y="-85" width="230" height="170" rx="20" fill="#ffffff" stroke="#e8d5c4" stroke-width="2"/>
    
    <!-- Header Bar tone cam/đỏ ấm san hô -->
    <path d="M -115,-60 Q -115,-85 -90,-85 L 90,-85 Q 115,-85 115,-60 L 115,-30 L -115,-30 Z" fill="url(#badgeGrad)"/>
    
    <!-- Móc gắn bảng -->
    <rect x="-70" y="-95" width="12" height="22" rx="6" fill="#f8fafc" stroke="#d5bdaf" stroke-width="1.5"/>
    <rect x="-6" y="-95" width="12" height="22" rx="6" fill="#f8fafc" stroke="#d5bdaf" stroke-width="1.5"/>
    <rect x="58" y="-95" width="12" height="22" rx="6" fill="#f8fafc" stroke="#d5bdaf" stroke-width="1.5"/>

    <!-- Biểu tượng Giỏ hàng Store & Nhánh Routing lồng nhau (Nested Routes) -->
    <g transform="translate(0, 18)">
      <!-- Shopping Cart Body -->
      <path d="M -24,-14 L -18,-14 L -10,10 L 16,10 L 22,-6 L -14,-6" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Wheels -->
      <circle cx="-7" cy="18" r="3.5" fill="#ea580c"/>
      <circle cx="13" cy="18" r="3.5" fill="#ea580c"/>
      <!-- Nested Branch Nodes inside Store -->
      <circle cx="2" cy="-14" r="3" fill="#10b981"/>
      <line x1="-12" y1="-6" x2="2" y2="-14" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2"/>
    </g>
  </g>

  <!-- ================= 4 HUY HIỆU ROUTE TRONG MINISTORE ================= -->

  <!-- 1. Route: / (Home) -->
  <g transform="translate(160, 140)" filter="url(#badgeShadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <!-- Icon Home -->
    <path d="M -44,3 L -44,8 L -34,8 L -34,3" stroke="#0284c7" stroke-width="2" fill="none"/>
    <path d="M -48,4 L -39,-4 L -30,4" stroke="#0284c7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <rect x="-14" y="-7" width="55" height="5" rx="2.5" fill="#334155"/>
    <rect x="-14" y="3" width="36" height="5" rx="2.5" fill="#0284c7"/>
  </g>

  <!-- 2. Route: /products?q=&category= (Products Query URL State) -->
  <g transform="translate(640, 140)" filter="url(#badgeShadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
    <!-- Icon Search / Filter -->
    <circle cx="-42" cy="-2" r="6" fill="none" stroke="#10b981" stroke-width="2"/>
    <line x1="-38" y1="2" x2="-32" y2="8" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <rect x="-14" y="-7" width="55" height="5" rx="2.5" fill="#334155"/>
    <rect x="-14" y="3" width="36" height="5" rx="2.5" fill="#10b981"/>
  </g>

  <!-- 3. Route: /products/:id (Dynamic Product Detail) -->
  <g transform="translate(230, 245)" filter="url(#badgeShadow)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6"/>
    <!-- Icon Tag ID -->
    <path d="M -46,-2 L -38,-10 L -30,-2 L -38,6 Z" fill="#8b5cf6"/>
    <circle cx="-38" cy="-2" r="1.5" fill="#ffffff"/>
    <rect x="-16" y="-5" width="48" height="4" rx="2" fill="#8b5cf6"/>
    <rect x="-16" y="3" width="32" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- 4. Route: /dashboard (Nested Layout & Outlet) -->
  <g transform="translate(570, 245)" filter="url(#badgeShadow)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
    <!-- Icon Dashboard Layout -->
    <rect x="-46" y="-8" width="8" height="8" rx="1.5" fill="#ea580c"/>
    <rect x="-36" y="-8" width="8" height="8" rx="1.5" fill="#ea580c" opacity="0.6"/>
    <rect x="-46" y="2" width="18" height="6" rx="1.5" fill="#ea580c"/>
    <rect x="-16" y="-5" width="48" height="4" rx="2" fill="#ea580c"/>
    <rect x="-16" y="3" width="32" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- ================= BANNER ĐIỂM NHẤN DƯỚI CÙNG ================= -->
  <g transform="translate(400, 310)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#badgeGrad)"/>
    <circle cx="-50" cy="0" r="3" fill="#0284c7"/>
    <circle cx="-25" cy="0" r="2" fill="#94a3b8"/>
    <circle cx="25" cy="0" r="2" fill="#94a3b8"/>
    <circle cx="50" cy="0" r="3" fill="#10b981"/>
  </g>

  <!-- Thanh Route Path Indicator -->
  <g transform="translate(400, 350)" filter="url(#badgeShadow)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#ffffff" stroke="#ebd9cc" stroke-width="1.5"/>
    <circle cx="-135" cy="0" r="7" fill="#0284c7"/>
    <rect x="-115" y="-7" width="105" height="14" rx="4" fill="#faeee3"/>
    <rect x="-110" y="-4" width="95" height="8" rx="2" fill="#0284c7"/>
    <rect x="5" y="-7" width="60" height="14" rx="4" fill="#ea580c"/>
    <circle cx="105" cy="-2" r="5" fill="#10b981"/>
    <path d="M 105,3 L 105,9" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="135" cy="0" r="7" fill="#8b5cf6"/>
  </g>

  <!-- Vạch màu chân ảnh -->
  <rect x="330" y="395" width="140" height="5" rx="2.5" fill="url(#badgeGrad)"/>
</svg>
