<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Nền màu da người nhạt ấm áp -->
    <linearGradient id="skinBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="50%" stop-color="#faeee3"/>
      <stop offset="100%" stop-color="#f4dfd0"/>
    </linearGradient>

    <!-- Header RESTful Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Accent Method Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8c5836" flood-opacity="0.16"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8c5836" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Nền Canvas màu da người nhạt -->
  <rect width="800" height="450" fill="url(#skinBgGrad)"/>

  <!-- Vầng sáng trang trí mềm mại -->
  <circle cx="120" cy="80" r="160" fill="#fbdcc4" opacity="0.45"/>
  <circle cx="700" cy="370" r="190" fill="#fce4d4" opacity="0.6"/>
  <circle cx="400" cy="170" r="180" fill="#ffffff" opacity="0.4"/>

  <!-- ================= TRUNG TÂM: REST API INSPECTION SERVER CONSOLE ================= -->
  <g transform="translate(400, 155)" filter="url(#softShadow)">
    <!-- Thẻ nền trắng console -->
    <rect x="-115" y="-85" width="230" height="170" rx="20" fill="#ffffff" stroke="#e8d5c4" stroke-width="2"/>
    
    <!-- Header Bar tone xanh dương / server console -->
    <path d="M -115,-60 Q -115,-85 -90,-85 L 90,-85 Q 115,-85 115,-60 L 115,-30 L -115,-30 Z" fill="url(#headerGrad)"/>
    
    <!-- Chân ốc gắn rack server -->
    <rect x="-70" y="-95" width="12" height="22" rx="6" fill="#f8fafc" stroke="#d5bdaf" stroke-width="1.5"/>
    <rect x="-6" y="-95" width="12" height="22" rx="6" fill="#f8fafc" stroke="#d5bdaf" stroke-width="1.5"/>
    <rect x="58" y="-95" width="12" height="22" rx="6" fill="#f8fafc" stroke="#d5bdaf" stroke-width="1.5"/>

    <!-- Biểu tượng Client - Server & JSON HTTP Packet -->
    <g transform="translate(0, 18)">
      <!-- Server Tower Icon -->
      <rect x="-24" y="-22" width="48" height="44" rx="6" fill="#0f172a"/>
      <!-- LED indicators -->
      <circle cx="-14" cy="-12" r="2.5" fill="#10b981"/>
      <circle cx="-6" cy="-12" r="2.5" fill="#38bdf8"/>
      <circle cx="2" cy="-12" r="2.5" fill="#f59e0b"/>
      <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#334155" stroke-width="2"/>
      <line x1="-14" y1="6" x2="14" y2="6" stroke="#334155" stroke-width="2"/>
      <line x1="-14" y1="14" x2="14" y2="14" stroke="#334155" stroke-width="2"/>
      <!-- Glowing activity point -->
      <circle cx="12" cy="-12" r="2" fill="#ef4444"/>
    </g>
  </g>

  <!-- ================= 4 HUY HIỆU HTTP METHODS CHÍNH ================= -->

  <!-- 1. GET Method (Xanh lá cây) -->
  <g transform="translate(160, 140)" filter="url(#badgeShadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
    <!-- Icon GET -->
    <rect x="-48" y="-7" width="18" height="14" rx="2" fill="#10b981"/>
    <polygon points="-40,-4 -34,0 -40,4" fill="#ffffff"/>
    <rect x="-14" y="-7" width="55" height="5" rx="2.5" fill="#334155"/>
    <rect x="-14" y="3" width="36" height="5" rx="2.5" fill="#10b981"/>
  </g>

  <!-- 2. POST Method (Cam) -->
  <g transform="translate(640, 140)" filter="url(#badgeShadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
    <!-- Icon POST Plus -->
    <circle cx="-40" cy="0" r="8" fill="#ea580c"/>
    <line x1="-40" y1="-4" x2="-40" y2="4" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-44" y1="0" x2="-36" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <rect x="-14" y="-7" width="55" height="5" rx="2.5" fill="#334155"/>
    <rect x="-14" y="3" width="36" height="5" rx="2.5" fill="#ea580c"/>
  </g>

  <!-- 3. PUT / PATCH Method (Xanh dương) -->
  <g transform="translate(230, 245)" filter="url(#badgeShadow)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
    <!-- Icon Edit Pen -->
    <path d="M -46,3 L -42,3 L -34,-5 L -38,-9 L -46,-1 Z" fill="#0284c7"/>
    <rect x="-16" y="-5" width="48" height="4" rx="2" fill="#0284c7"/>
    <rect x="-16" y="3" width="32" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- 4. DELETE Method (Đỏ) -->
  <g transform="translate(570, 245)" filter="url(#badgeShadow)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#ffffff" stroke="#ef4444" stroke-width="1.6"/>
    <!-- Icon Trash Bin -->
    <path d="M -44,-5 L -36,-5 L -37,5 L -43,5 Z" fill="#ef4444"/>
    <line x1="-46" y1="-6" x2="-34" y2="-6" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <rect x="-16" y="-5" width="48" height="4" rx="2" fill="#ef4444"/>
    <rect x="-16" y="3" width="32" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- ================= BANNER ĐIỂM NHẤN: CLIENT - SERVER REST ================= -->
  <g transform="translate(400, 310)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#headerGrad)"/>
    <circle cx="-50" cy="0" r="3" fill="#10b981"/>
    <circle cx="-25" cy="0" r="2" fill="#94a3b8"/>
    <circle cx="25" cy="0" r="2" fill="#94a3b8"/>
    <circle cx="50" cy="0" r="3" fill="#ea580c"/>
  </g>

  <!-- Thanh Status Code & Port Indicator -->
  <g transform="translate(400, 350)" filter="url(#badgeShadow)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#ffffff" stroke="#ebd9cc" stroke-width="1.5"/>
    <circle cx="-135" cy="0" r="7" fill="#10b981"/>
    <!-- "HTTP 200 OK" vector representation -->
    <rect x="-115" y="-7" width="105" height="14" rx="4" fill="#faeee3"/>
    <rect x="-110" y="-4" width="95" height="8" rx="2" fill="#10b981"/>
    <rect x="5" y="-7" width="60" height="14" rx="4" fill="#0284c7"/>
    <circle cx="105" cy="-2" r="5" fill="#f59e0b"/>
    <path d="M 105,3 L 105,9" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="135" cy="0" r="7" fill="#2563eb"/>
  </g>

  <!-- Vạch màu chân ảnh -->
  <rect x="330" y="395" width="140" height="5" rx="2.5" fill="url(#headerGrad)"/>
</svg>
