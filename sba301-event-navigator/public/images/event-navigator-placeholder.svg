<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Nền màu da người nhạt ấm áp -->
    <linearGradient id="skinBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="50%" stop-color="#faeee3"/>
      <stop offset="100%" stop-color="#f4dfd0"/>
    </linearGradient>

    <!-- Gradient thanh điều hướng & la bàn -->
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Warm soft drop shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8c5836" flood-opacity="0.16"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8c5836" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Nền Canvas màu da người nhạt -->
  <rect width="800" height="450" fill="url(#skinBgGrad)"/>

  <!-- Vầng sáng trang trí mềm mại -->
  <circle cx="120" cy="80" r="160" fill="#fbdcc4" opacity="0.45"/>
  <circle cx="700" cy="370" r="190" fill="#fce4d4" opacity="0.6"/>
  <circle cx="400" cy="170" r="180" fill="#ffffff" opacity="0.4"/>

  <!-- ================= TRUNG TÂM: CAMPUS NAVIGATION & ROUTING DASHBOARD ================= -->
  <g transform="translate(400, 155)" filter="url(#softShadow)">
    <!-- Thẻ nền trắng trang nhã -->
    <rect x="-115" y="-85" width="230" height="170" rx="20" fill="#ffffff" stroke="#e8d5c4" stroke-width="2"/>
    
    <!-- Header Bar tone cam/hồng san hô ấm -->
    <path d="M -115,-60 Q -115,-85 -90,-85 L 90,-85 Q 115,-85 115,-60 L 115,-30 L -115,-30 Z" fill="url(#needleGrad)"/>
    
    <!-- Móc treo lịch / bảng thông tin -->
    <rect x="-70" y="-95" width="12" height="22" rx="6" fill="#f8fafc" stroke="#d5bdaf" stroke-width="1.5"/>
    <rect x="-6" y="-95" width="12" height="22" rx="6" fill="#f8fafc" stroke="#d5bdaf" stroke-width="1.5"/>
    <rect x="58" y="-95" width="12" height="22" rx="6" fill="#f8fafc" stroke="#d5bdaf" stroke-width="1.5"/>

    <!-- Biểu tượng La bàn Định vị & Bản đồ Tuyến đường (Navigation Compass) -->
    <g transform="translate(0, 18)">
      <!-- Vòng ngoài la bàn -->
      <circle cx="0" cy="0" r="42" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3"/>
      
      <!-- Kim la bàn điều hướng (Compass needle) -->
      <polygon points="0,-32 9,0 0,6 -9,0" fill="url(#needleGrad)"/>
      <polygon points="0,32 9,0 0,-6 -9,0" fill="#94a3b8"/>
      
      <!-- Tâm la bàn -->
      <circle cx="0" cy="0" r="4" fill="#ffffff" stroke="#475569" stroke-width="2"/>

      <!-- Chỉ dẫn hướng 4 điểm N, S, E, W -->
      <circle cx="0" cy="-37" r="2" fill="#e11d48"/>
      <circle cx="37" cy="0" r="2" fill="#64748b"/>
      <circle cx="0" cy="37" r="2" fill="#64748b"/>
      <circle cx="-37" cy="0" r="2" fill="#64748b"/>
    </g>
  </g>

  <!-- ================= CÁC HUY HIỆU ROUTE TRONG SPA ================= -->

  <!-- 1. Route: / (Home View) -->
  <g transform="translate(160, 140)" filter="url(#badgeShadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <!-- Icon Home -->
    <path d="M -44,3 L -44,8 L -34,8 L -34,3" stroke="#0284c7" stroke-width="2" fill="none"/>
    <path d="M -48,4 L -39,-4 L -30,4" stroke="#0284c7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <rect x="-14" y="-7" width="55" height="5" rx="2.5" fill="#334155"/>
    <rect x="-14" y="3" width="36" height="5" rx="2.5" fill="#0284c7"/>
  </g>

  <!-- 2. Route: /events (Collection List) -->
  <g transform="translate(640, 140)" filter="url(#badgeShadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="24" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/>
    <!-- Icon List Cards -->
    <rect x="-48" y="-7" width="18" height="15" rx="2" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="-44" y1="-2" x2="-34" y2="-2" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-44" y1="2" x2="-36" y2="2" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="-14" y="-7" width="55" height="5" rx="2.5" fill="#334155"/>
    <rect x="-14" y="3" width="36" height="5" rx="2.5" fill="#8b5cf6"/>
  </g>

  <!-- 3. Route: /events/:id (Dynamic Resource Detail) -->
  <g transform="translate(230, 245)" filter="url(#badgeShadow)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#ffffff" stroke="#10b981" stroke-width="1.6"/>
    <!-- Icon Pin / Location ID -->
    <path d="M -40,-8 C -45,-8 -48,-4 -48,0 C -48,6 -40,11 -40,11 C -40,11 -32,6 -32,0 C -32,-4 -35,-8 -40,-8 Z" fill="#10b981"/>
    <circle cx="-40" cy="-2" r="2.5" fill="#ffffff"/>
    <rect x="-16" y="-5" width="48" height="4" rx="2" fill="#10b981"/>
    <rect x="-16" y="3" width="32" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- 4. Route: /about & 404 (History / Info) -->
  <g transform="translate(570, 245)" filter="url(#badgeShadow)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
    <!-- Icon Info -->
    <circle cx="-40" cy="0" r="8" fill="none" stroke="#ea580c" stroke-width="2"/>
    <circle cx="-40" cy="-4" r="1.2" fill="#ea580c"/>
    <line x1="-40" y1="-1" x2="-40" y2="4" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
    <rect x="-16" y="-5" width="48" height="4" rx="2" fill="#ea580c"/>
    <rect x="-16" y="3" width="32" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- ================= BANNER ĐIỂM NHẤN: SPA ROUTING ================= -->
  <g transform="translate(400, 310)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#needleGrad)"/>
    <circle cx="-50" cy="0" r="3" fill="#0284c7"/>
    <circle cx="-25" cy="0" r="2" fill="#94a3b8"/>
    <circle cx="25" cy="0" r="2" fill="#94a3b8"/>
    <circle cx="50" cy="0" r="3" fill="#8b5cf6"/>
  </g>

  <!-- Thanh Route Path Indicator -->
  <g transform="translate(400, 350)" filter="url(#badgeShadow)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#ffffff" stroke="#ebd9cc" stroke-width="1.5"/>
    <circle cx="-135" cy="0" r="7" fill="#0284c7"/>
    <rect x="-115" y="-7" width="105" height="14" rx="4" fill="#faeee3"/>
    <rect x="-110" y="-4" width="95" height="8" rx="2" fill="#0284c7"/>
    <rect x="5" y="-7" width="60" height="14" rx="4" fill="#ea580c"/>
    <circle cx="105" cy="-2" r="5" fill="#10b981"/>
    <path d="M 105,3 L 105,9" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="135" cy="0" r="7" fill="#8b5cf6"/>
  </g>

  <!-- Vạch màu chân trang -->
  <rect x="330" y="395" width="140" height="5" rx="2.5" fill="url(#needleGrad)"/>
</svg>
